name: virtual-thread-orchestrator
services:
  api:
    build: .
    environment:
      PROVIDER_URL: http://provider:9096
    ports: ["127.0.0.1:${API_PORT:-8086}:8080"]
    depends_on: [provider]
  provider:
    build: ./simulator
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:${UI_PORT:-4206}:8080"]
    depends_on: [api]
  prometheus:
    image: prom/prometheus:v3.4.1
    volumes: ["./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9097:9090"]
